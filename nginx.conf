server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  # Each project is its own app, with its pages drawn in the browser, so a refresh has
  # to get the right index.html: Tabletsgo's under /tabletsgo/, Aidapedia's for the rest.
  # $uri/index.html rather than $uri/, which would redirect to the container's port 80
  # instead of the mapped one.
  location / {
    try_files $uri $uri/index.html /index.html;
  }

  location /tabletsgo/ {
    try_files $uri $uri/index.html /tabletsgo/index.html;
  }

  # Vite puts a content hash in these filenames, so they can be cached for good.
  location ~ ^/(tabletsgo/)?assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
