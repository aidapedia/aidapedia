# One app on a domain of its own (apps/<app>/docker-compose.yml). nginx.conf is the
# shared site, with both apps on one domain.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  # The pages are drawn in the browser, so every unknown path gets the app's index.html.
  # $uri/index.html rather than $uri/, which would redirect to the container's port 80
  # instead of the mapped one.
  location / {
    try_files $uri $uri/index.html /index.html;
  }

  # Vite puts a content hash in these filenames, so they can be cached for good.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
