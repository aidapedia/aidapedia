# Hayat's product page and docs on a domain of their own. Aidapedia's site is
# deployed apart (apps/aidapedia/docker-compose.yml); the footer links to it.
#
#   cd apps/hayat
#   AIDAPEDIA_URL=https://aidapedia.example.com/ docker compose up -d --build
#
# Every app on one domain instead: the root docker-compose.yml.
services:
  hayat:
    build:
      context: ../..
      dockerfile: apps/hayat/Dockerfile
      args:
        # This site's own address; a path is enough when it is served from the domain root.
        HAYAT_URL: ${HAYAT_URL:-/}
        AIDAPEDIA_URL: ${AIDAPEDIA_URL:?set AIDAPEDIA_URL (where Aidapedia's site is reached, e.g. https://aidapedia.example.com/)}
    ports:
      - "${PORT:-8082}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
